databases:
  # ──────────────────────────────────────────────────────────────
  #  PostgreSQL Database (plan free = expire après une période
  #  limitée, vérifie la durée actuelle dans la doc Render)
  # ──────────────────────────────────────────────────────────────
  - name: inventory-db
    databaseName: inventory
    user: inventory_user        # ⚠️ "postgres" est réservé
    plan: free
    region: oregon
    ipAllowList: []             # aucune connexion externe

services:
  # ──────────────────────────────────────────────────────────────
  #  API Server (Node.js/Express) — Web Service
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: inventory-api
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@votredomaine.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Admin
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ⚠️ Pas de disque sur le plan free : /app/uploads est éphémère
      # et sera vidé à chaque redéploiement / redémarrage.
      - key: UPLOAD_DIR
        value: /tmp/uploads
    healthCheckPath: /api/healthz
    autoDeploy: true

  # ──────────────────────────────────────────────────────────────
  #  Frontend (React/Vite → Nginx)
  # ──────────────────────────────────────────────────────────────
  - type: web
    name: inventory-frontend
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
      - key: BASE_PATH
        value: /
      - key: PORT
        value: "80"
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: inventory-api
          type: web
          property: host      # hostname interne réel, pas "inventory-api"
    autoDeploy: true