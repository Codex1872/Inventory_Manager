databases:
  - name: inventory-db
    databaseName: inventory
    user: inventory_user
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ── API (Node/Express) ──────────────────────────────────────
  - type: web
    name: inventory-api
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@votredomaine.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Admin
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Éphémère : vidé à chaque redéploiement (pas de disque en free)
      - key: UPLOAD_DIR
        value: /tmp/uploads
    healthCheckPath: /api/healthz
    autoDeploy: true

  # ── Frontend (Vite → Nginx) ─────────────────────────────────
  - type: web
    name: inventory-frontend
    plan: free
    region: oregon
    runtime: docker
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    envVars:
      - key: BASE_PATH
        value: /
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
      # Origine complète AVEC schéma, ex: https://inventory-api-xxxx.onrender.com
      - key: API_ORIGIN
        sync: false
    autoDeploy: true